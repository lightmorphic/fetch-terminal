name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The visible "Last updated" date, the structured data's
      # dateModified, and the sitemap lastmod all derive from the newest
      # dated entry in CHANGELOG.md — self-maintaining, and never the
      # build timestamp (a redeploy is not a content change).
      - name: Stamp last-updated from the changelog
        run: |
          d=$(grep -oE '^## \[[0-9.]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md | head -n1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ -n "$d" ]; then
            human=$(date -u -d "$d" '+%-d %B %Y')
            sed -i -E "s|<time id=\"last-updated\" datetime=\"[0-9-]+\">[^<]*</time>|<time id=\"last-updated\" datetime=\"$d\">$human</time>|" site/index.html
            sed -i -E "s|\"dateModified\": \"[0-9-]+\"|\"dateModified\": \"$d\"|" site/index.html
            sed -i -E "s|<lastmod>[0-9-]+</lastmod>|<lastmod>$d</lastmod>|" site/sitemap.xml
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
