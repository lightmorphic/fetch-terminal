name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/release (defaults to package.json version)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every value below that can be influenced by workflow input (the
      # manual "version" dispatch input) or a prior step's output is passed
      # through env: and read from the environment inside the script, never
      # substituted directly into the run: block via ${{ }} — that
      # substitution happens as plain text before the shell ever sees it,
      # so an unquoted, unsanitized value there is a script-injection
      # vector straight into a job that holds GITHUB_TOKEN.
      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npx electron-builder --publish never

      - name: Locate build artifacts
        id: artifacts
        run: |
          appimage=$(find "$HOME/Downloads" dist -iname "*.AppImage" 2>/dev/null | head -n1)
          yml=$(find dist -iname "latest-linux.yml" 2>/dev/null | head -n1)
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "yml=$yml" >> "$GITHUB_OUTPUT"

      - name: Attach build artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          APPIMAGE: ${{ steps.artifacts.outputs.appimage }}
          YML: ${{ steps.artifacts.outputs.yml }}
        run: |
          gh release upload "$VERSION" "$APPIMAGE" "$YML" --clobber
