<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Fetch Terminal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="titlebar">
    <button id="sidebar-toggle" class="icon-btn titlebar-btn" data-icon="sidebar" title="Toggle snippets sidebar (Ctrl+Shift+B)"></button>
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="new-tab-btn" class="icon-btn" data-icon="plus" title="New tab (Ctrl+Shift+T)"></button>
    </div>
    <div class="titlebar-drag spacer"></div>
    <div class="titlebar-popover-anchor">
      <button id="accent-btn" class="icon-btn titlebar-btn" data-icon="palette" title="Accent color"></button>
      <div id="accent-popover" class="popover hidden">
        <div class="popover-scrim"></div>
        <div class="popover-panel">
          <div class="popover-title">Accent color</div>
          <div id="accent-swatches"></div>
        </div>
      </div>
    </div>
    <button id="theme-toggle-btn" class="icon-btn titlebar-btn" data-icon="moon" title="Toggle light / dark theme"></button>
    <div class="titlebar-brand titlebar-drag"><span class="app-title">Fetch Terminal</span></div>
    <div id="window-controls">
      <button id="btn-min" class="win-btn" data-icon="minimize" title="Minimize"></button>
      <button id="btn-max" class="win-btn" data-icon="maximize" title="Maximize"></button>
      <button id="btn-close" class="win-btn win-btn-close" data-icon="closeWindow" title="Close"></button>
    </div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="search-field search-field-short">
          <span class="search-icon" data-icon="search"></span>
          <input id="snippet-search" placeholder="Search snippets" autocomplete="off" />
        </div>
        <button id="pin-btn" class="icon-btn accent-icon-btn" data-icon="unlock" title="Keep sidebar open"></button>
      </div>
      <div id="snippet-list"></div>
      <div id="sidebar-footer">
        <button id="add-snippet-btn" class="text-btn">+ New snippet</button>
        <div class="footer-row">
          <button id="import-btn" class="text-btn small neutral" data-icon-inline="import">Import</button>
          <button id="export-btn" class="text-btn small neutral" data-icon-inline="export">Export</button>
        </div>
        <div id="app-brand">
          <span class="app-brand-name">Fetch Terminal</span>
          <span id="app-brand-version" class="app-brand-version"></span>
          <button id="update-btn" class="update-btn hidden"></button>
        </div>
      </div>
    </aside>

    <div id="terminals"></div>
  </div>

  <div id="history-modal" class="modal hidden">
    <div class="modal-scrim"></div>
    <div class="modal-card history-card">
      <div class="search-field modal-search">
        <span class="search-icon" data-icon="search"></span>
        <input id="history-search" placeholder="Search command history" autocomplete="off" />
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="snippet-modal" class="modal hidden">
    <div class="modal-scrim"></div>
    <div class="modal-card">
      <h3 id="snippet-modal-title">New snippet</h3>
      <label class="field-label">Name <span class="hint">(optional — falls back to the command)</span>
        <input id="snippet-name-input" placeholder="e.g. Deploy prod" autocomplete="off" />
      </label>
      <label class="field-label">Command
        <textarea id="snippet-command-input" rows="3" placeholder="e.g. ssh user@example.com"></textarea>
      </label>
      <div class="modal-actions">
        <button id="snippet-delete-btn" class="text-btn danger hidden">Delete</button>
        <span class="spacer"></span>
        <button id="snippet-cancel-btn" class="text-btn">Cancel</button>
        <button id="snippet-save-btn" class="filled-btn">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
